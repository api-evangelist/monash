apis:
- aid: monash:idp
  name: Monash University Identity Provider (AAF Rapid IdP tenant)
  description: Monash's federated login, published as a signed SAML 2.0 EntityDescriptor at
    https://idp.monash.edu.au/idp/shibboleth (HTTP 200, application/xml). Declares HTTP-POST and
    HTTP-Redirect SSO bindings, separate signing and encryption key descriptors, a shibmd:Scope of
    monash.edu.au, and release of auEduPersonSharedToken, email and displayName; the entity is
    registered in the Australian Access Federation production aggregate and flows into eduGAIN. It is
    the most complete machine-readable contract in this profile and it is a tenant surface, not a
    Monash-engineered one — the metadata is captured here, but the contract scores against AAF.
  humanURL: https://idp.monash.edu.au/idp/shibboleth
  baseURL: https://idp.monash.edu.au/idp/
  tags:
  - Identity Federation
  - SAML
  - Shibboleth
  - Single Sign-On
  properties:
  - type: IdentityFederation
    url: https://idp.monash.edu.au/idp/shibboleth
  - type: Metadata
    url: identity-federation/monash-idp-saml-metadata.xml
  - type: Conformance
    url: conformance/monash-conformance.yml
  x-operator: tenant
  x-operator-basis: Monash hostname, AAF infrastructure. idp.monash.edu.au CNAMEs to
    c2d8eee96e6328c487bda2d5476f7050.idp-cname.aaf.edu.au and resolves to 18.239.183.0/24, which whois
    attributes to Amazon Technologies Inc. (AT-88-Z). That CNAME pattern is AAF's Rapid IdP, a fully
    AAF-managed SaaS identity provider; idp.unimelb.edu.au matches it, while self-hosting institutions
    such as UQ resolve into their own address space. The TLS certificate is Amazon-issued rather than
    the Sectigo OV certificates Monash procures for hosts it runs itself. Monash's identity data,
    attribute release and scope; AAF's engineering.
- aid: monash:eresearch-hpc-sp
  name: Monash eResearch Center HPC ID (SAML Service Provider)
  description: A second Monash-operated SAML service provider, entityID
    https://hpc.erc.monash.edu.au/shibboleth, registered in the Australian Access Federation under
    Organization "Monash University". The entityID dereferences to an HTML login landing page rather
    than standalone metadata, so the authoritative machine-readable description is the AAF aggregate
    entry rather than a per-entity metadata URL.
  humanURL: https://hpc.erc.monash.edu.au/
  baseURL: https://hpc.erc.monash.edu.au/
  tags:
  - Identity Federation
  - Research Computing
  - SAML
  properties:
  - type: IdentityFederation
    url: https://md.aaf.edu.au/aaf-metadata.xml
  x-operator: institution
  x-operator-basis: Resolves to 118.138.238.241, netname MONASHUNI-NET3 / ORG-MU4-AP "Monash
    University" (APNIC), with no CNAME off Monash infrastructure and a Monash-procured Sectigo OV
    certificate. The AAF Organization block names Monash University. This is the only federation entity
    of the five that survives an IP-ownership check as institution-operated.
- aid: monash:crams
  name: CRAMS API (Cloud Resource Allocation and Management System)
  description: Monash eResearch operates the Cloud Resource Allocation and Management System (CRAMS),
    an institutional portal for managing research cloud resource allocations. The host responds HTTP
    200 with a real application shell (nginx, Django, x-frame-options DENY, HSTS 63072000). Access is
    institutional and gated; /api/, /swagger/ and /docs/ all return 404, and no open specification was
    located. Recorded as an institution-operated surface with no published contract — not as an API
    with a contract we do not have.
  humanURL: https://crams-api.erc.monash.edu/
  baseURL: https://crams-api.erc.monash.edu/
  tags:
  - eResearch
  - Cloud
  - Research Infrastructure
  - Research Computing
  properties:
  - type: Documentation
    url: https://crams-api.erc.monash.edu/
  x-operator: institution
  x-operator-basis: Resolves to 118.138.238.174, netname MONASHUNI-NET3 "Monash University" (APNIC),
    on a Monash-procured Sectigo OV certificate.
- aid: monash:eresearch-docs
  name: Monash eResearch Documentation (M3 / MASSIVE)
  description: Public documentation for the compute, storage, application and training services Monash
    eResearch runs, including the M3 and MonARCH HPC clusters. massive.org.au, www.massive.org.au and
    docs.massive.org.au all redirect here, to Monash's own domain. Institution-operated documentation;
    no machine-readable contract is published.
  humanURL: https://docs.erc.monash.edu/
  baseURL: https://docs.erc.monash.edu/
  tags:
  - Research Computing
  - HPC
  - Documentation
  properties:
  - type: Documentation
    url: https://docs.erc.monash.edu/
  - type: ResearchComputing
    url: https://docs.erc.monash.edu/Compute/HPC/M3/
  x-operator: institution
  x-operator-basis: Resolves to 130.194.250.205, netname MONASHUNI-AU "Monash University" (APNIC).
    The intermediate CNAME apps.merc-managed.cloud.edu.au reads as third-party but is Monash eResearch
    Centre's own naming on Monash address space — an IP check, not the CNAME, settles this one.
- aid: monash:bridges
  name: Bridges — Monash Research Repository (Figshare tenant)
  description: Monash's institutional research data repository, "Bridges", operating on the Figshare
    platform. bridges.monash.edu and monash.figshare.com both resolve as CNAMEs to figshare.com. The
    data, the collections and the DOIs are Monash's; the REST API and OAI-PMH contract are Figshare's
    and are shared by every Figshare customer. Recorded as a tenant relationship. Figshare's generic
    specification is deliberately NOT saved under this institution — it was previously attributed here
    and to 24 other universities, and that misattribution is what this profile now corrects.
  humanURL: https://bridges.monash.edu/
  baseURL: https://bridges.monash.edu/
  tags:
  - Research Repository
  - Research Data
  - Open Access
  properties:
  - type: ResearchRepository
    url: https://bridges.monash.edu/
  x-operator: tenant
  x-operator-basis: bridges.monash.edu CNAME -> figshare.com. Institution-specific hostname on a vendor
    platform. Vendor repo, api-evangelist/figshare, is where the contract belongs.
- aid: monash:pure
  name: Monash Research Portal (Elsevier Pure tenant)
  description: Monash's research outputs, profiles and publication metadata portal, running on Elsevier
    Pure. research.monash.edu resolves as a CNAME chain to monash.elsevierpure.com and then to
    apac.prod.elsevierpure.com. The Pure web services endpoint /ws/oai returned HTTP 500 with body
    {"status":999} — a WAF rejection, not a working OAI-PMH Identify response. Tenant relationship;
    the Pure contract is Elsevier's.
  humanURL: https://research.monash.edu/
  baseURL: https://research.monash.edu/
  tags:
  - Research Repository
  - Research Outputs
  - CRIS
  properties:
  - type: ResearchRepository
    url: https://research.monash.edu/
  x-operator: tenant
  x-operator-basis: research.monash.edu CNAME -> monash.elsevierpure.com -> apac.prod.elsevierpure.com.
- aid: monash:handbook
  name: Monash University Handbook (CourseLoop tenant)
  description: The official Monash course, unit and area-of-study catalog. The site is a Next.js
    application on Monash's own hostname, but its runtime configuration
    (window.__SITE_ENV_CONFIG__) points every data call at api-ap-southeast-2.prod.courseloop.com — a
    regional CourseLoop host shared across that vendor's customers. handbook.monash.edu/api/ returns
    the AWS API Gateway string {"message":"Missing Authentication Token"}, i.e. an unmatched route on a
    gateway, not a documented Monash API. Course catalog data is Monash's; the contract is CourseLoop's.
  humanURL: https://handbook.monash.edu/
  baseURL: https://handbook.monash.edu/
  tags:
  - Course Catalog
  - Curriculum
  - Student Systems
  properties:
  - type: CourseCatalog
    url: https://handbook.monash.edu/
  x-operator: tenant
  x-operator-basis: handbook.monash.edu is a Monash hostname, but API_DOMAIN is
    api-ap-southeast-2.prod.courseloop.com, a shared vendor host.
- aid: monash:library-discovery
  name: Monash Library Discovery (Ex Libris Primo tenant)
  description: Monash Library's discovery layer. search.lib.monash.edu redirects to
    monash.primo.exlibrisgroup.com/discovery/search?vid=61MONASH_AU:MONUI — a Monash-specific view
    code on Ex Libris's Primo platform. Tenant relationship; the Primo and Alma contracts are Ex
    Libris's and are documented at developers.exlibrisgroup.com, not by Monash.
  humanURL: https://search.lib.monash.edu/
  baseURL: https://monash.primo.exlibrisgroup.com/discovery/search?vid=61MONASH_AU:MONUI
  tags:
  - Library
  - Discovery
  - Catalog
  properties:
  - type: LibraryCatalog
    url: https://search.lib.monash.edu/
  x-operator: tenant
  x-operator-basis: search.lib.monash.edu 302 -> monash.primo.exlibrisgroup.com with Monash view code
    61MONASH_AU:MONUI.

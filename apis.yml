x-coverage:
  state: covered
  reason: institution_surface_verified_no_contract
  detail: >-
    Three institution-operated surfaces confirmed live and confirmed Monash-owned by IP, not by
    hostname: crams-api.erc.monash.edu and hpc.erc.monash.edu.au in MONASHUNI-NET3, and
    docs.erc.monash.edu in MONASHUNI-AU. None of the three publishes an OpenAPI, AsyncAPI or other
    open specification — CRAMS returns 404 on /api/, /swagger/ and /docs/ — so this profile records
    institution-operated surfaces with no institution-published contract, which is the honest result
    rather than a gap to be padded. Monash's only evidenced education-regime conformance (SAML,
    Shibboleth) comes from a single AAF federation entry for the HPC service provider.

    Five further surfaces are real institutional facts but tenant relationships on platforms Monash
    does not run: AAF Rapid IdP, Figshare, Elsevier Pure, CourseLoop and Ex Libris. Their contracts
    are deliberately not saved here. The IdP is the notable one — it publishes the single most
    complete machine-readable contract in this profile and an earlier pass in this same run recorded
    it as institution-operated on hostname evidence, until DNS and whois showed it terminating on
    Amazon address space behind AAF's managed service.

    The principal web estate at www.monash.edu sits behind a Cloudflare managed challenge
    (cf-mitigated: challenge) and is live-but-unreadable to non-browser clients — a limitation of our
    probe, not of Monash. No open data portal, no institution-operated OAI-PMH endpoint, and no
    central developer portal exist: data.monash.edu, api.monash.edu and developer.monash.edu do not
    resolve at all.

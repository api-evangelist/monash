aid: monash
name: Monash University
description: 'Monash University is a public research university in Melbourne, Australia, and a member
  of the Group of Eight. Its genuinely institution-operated programmable footprint is small but real,
  and it is not where a company''s would be. Its three institution-operated surfaces all belong to
  Monash eResearch and all resolve into Monash''s own APNIC address space: the Cloud Resource Allocation
  and Management System (CRAMS) portal, a public documentation site for the M3/MASSIVE HPC estate, and a
  Shibboleth service provider federated through the Australian Access Federation. None of the three
  publishes an open specification, so Monash''s only evidenced domain-standard conformance (SAML,
  Shibboleth) rests on that one federation entry. The Monash-branded identity provider at
  idp.monash.edu.au looks like the strongest contract here and is not Monash''s: it CNAMEs to
  idp-cname.aaf.edu.au on Amazon address space, making it a tenant of AAF''s fully managed Rapid IdP.
  Everything else that looks like a Monash API is a vendor platform running under a Monash hostname:
  the Bridges research repository is Figshare (bridges.monash.edu is a CNAME to figshare.com),
  research.monash.edu is Elsevier Pure, the Handbook course catalog runs on CourseLoop, and library
  discovery is Ex Libris Primo. Those are recorded here as tenant relationships, not as Monash
  contracts. No central institutional developer portal, no open data portal, and no institution-operated
  OAI-PMH endpoint were found.'
